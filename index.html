<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Study Planner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>AI Study Planner</h1>
  <p>Add your exams. The planner makes a daily schedule and adjusts when you miss a day.</p>

  <section class="card">
    <h2>1. Add a subject</h2>
    <input id="name" placeholder="Subject name">
    <input id="date" type="date">
    <select id="difficulty">
      <option value="1">1 - Easy</option>
      <option value="2">2</option>
      <option value="3" selected>3 - Medium</option>
      <option value="4">4</option>
      <option value="5">5 - Hard</option>
    </select>
    <button id="addBtn">Add</button>
    <ul id="subjectList"></ul>
    <label>Study hours per day <input id="hours" type="number" min="1" max="12" value="4"></label>
  </section>

  <section class="card">
    <h2>2. Today's plan</h2>
    <div id="today"></div>
    <button id="doneBtn">Done today</button>
    <button id="missedBtn">I missed today</button>
  </section>

  <section class="card">
    <h2>3. Full schedule</h2>
    <table id="schedule"></table>
  </section>
<section class="card" id="pomodoro">
    <h2>3. Pomodoro timer</h2>
    <p id="timerMode">Focus time</p>
    <div id="timerDisplay">25:00</div>
    <button id="startBtn">Start</button>
    <button id="pauseBtn">Pause</button>
    <button id="resetBtn">Reset</button>
    <label>Focus minutes <input id="focusMin" type="number" min="1" max="90" value="25"></label>
    <label>Break minutes <input id="breakMin" type="number" min="1" max="30" value="5"></label>
    <p id="timerCount">Focus sessions today: 0</p>
  </section>
  <script src="script.js"></script>
</body>
</html>
